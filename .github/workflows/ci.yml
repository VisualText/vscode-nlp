# Continuous integration for the NLP++ VSCode extension.
#
# Three jobs, split by what they need rather than by what they do:
#
#   checks   - everything that runs against this repository alone. Needs the
#              grammars/ submodule, because check-grammars validates the vendored
#              TextMate bundle and the language-configuration twins.
#   format   - the formatter corpus harness, which needs real NLP++ to chew on.
#              No .nlp file lives in this repository, so the corpus is cloned from
#              the org's public analyzer repos.
#   integration - the only suite that runs inside a real VS Code. Covers the layer
#              the other harnesses deliberately exclude: activation, command
#              registration and provider wiring. Needs a display, hence xvfb.
#   package  - proves the vsix still builds and ships the right files. This is the
#              job that would have caught the .vscodeignore fix that never reached
#              master before 3.12.5.

name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A new push to a branch makes the in-flight run for that branch obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # grammars/ is the VisualText/nlpplus-tmbundle submodule; check-grammars
          # fails loudly without it, which is the whole point of that script.
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          # VSCode 1.95 (our engines floor) runs on Electron's Node 20.
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Grammar and language-configuration guard
        run: npm run check-grammars

      # No job builds telemetry-worker/, so nothing here would notice its undici
      # override being dropped -- which would silently restore twelve advisories.
      # This reads the lockfile rather than installing, so it costs nothing.
      - name: Telemetry worker dependency guard
        run: npm run check-worker

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Language intelligence tests
        run: npm run test:language

      - name: Tree view tests
        run: npm run test:treeview

  format:
    name: Formatter corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      # The corpus. These are the org's public NLP++ analyzers -- roughly a
      # thousand .nlp/.pat files of real, hand-written code, which is the only
      # thing that meaningfully exercises a lossless formatter. Add repos here to
      # widen coverage; the harness takes any number of directories.
      #
      # submodules: recursive is load-bearing. Three of these four repos embed
      # their analyzers as submodules, and without it the corpus checks out at
      # 376 files instead of 934 -- a job that passes while silently verifying
      # 40% of what it claims to.
      - uses: actions/checkout@v7
        with:
          repository: VisualText/analyzers
          path: corpus/analyzers
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: VisualText/parse-en-us
          path: corpus/parse-en-us
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: VisualText/package-analyzers
          path: corpus/package-analyzers
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          repository: VisualText/analyzer-templates
          path: corpus/analyzer-templates
          submodules: recursive

      - run: npm ci

      # Checks tokenizer/region round-trips, idempotency, and range-vs-full
      # equivalence on every file. --min is the guard against a corpus that
      # quietly shrinks: the four repos currently supply 934 files, so anything
      # under 900 means a clone or a submodule did not arrive and the job fails
      # rather than reporting success over a fraction of the corpus.
      - name: Formatter invariants over the public analyzer corpus
        run: npm run test:format -- --min 900 corpus/analyzers corpus/parse-en-us corpus/package-analyzers corpus/analyzer-templates

  integration:
    name: VS Code integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # The harness loads the extension from source via extensionDevelopmentPath,
      # and package.json main points at the webpack bundle -- so it has to exist
      # before VS Code starts, or the extension fails to load and every
      # assertion fails with it.
      - name: Build the extension bundle
        run: npm run webpack

      # xvfb-run supplies the display that VS Code needs on a headless runner.
      # -a picks a free server number rather than colliding on :99.
      - name: Activation, command registration and provider wiring
        run: xvfb-run -a npm run test:integration

  package:
    name: Build vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Package
        run: npm run vsce-package

      # Downloadable from the run summary, so a reviewer can install the exact
      # build a PR produces instead of building it themselves.
      - uses: actions/upload-artifact@v7
        with:
          name: vscode-nlp-vsix
          path: vscode.nlp.vsix
          if-no-files-found: error
