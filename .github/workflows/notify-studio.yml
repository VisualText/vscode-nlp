# Install at: VisualText/vscode-nlp -> .github/workflows/notify-studio.yml
#            (on the default branch, `master` -- workflow_run only fires for
#             workflow files that exist there)
#
# Tells nlp-studio to rebuild studio.visualtext.org once this repo's release
# assets are in place.
#
# Hooked to "Release" completing rather than to the release event
# itself, because that is the workflow that attaches the nlp-<version>.vsix.
# A `release: published` trigger would fire while the assets are still being
# uploaded, and the studio build would fetch a release that has nothing on it.
#
# Note: "Release" also runs on every push to master and only publishes when
# package.json's version actually changed, so this will sometimes ping for a
# push that released nothing. That is fine -- see below.
#
# Firing more often than necessary is harmless: nlp-studio compares upstream
# release tags against the labels on its running image and exits in about a
# second when they already match. It does not rebuild on a ping alone.
#
# Requires the shared `CLASSIC_PAT` secret (the same one the other cross-repo
# dispatches in this org already use).

name: Notify NLP-Studio

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    # Only on success. A failed asset run means the release is incomplete, and
    # rebuilding the site against it would either fail or ship half a release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ping nlp-studio
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.CLASSIC_PAT }}
          repository: VisualText/nlp-studio
          event-type: upstream-release
          client-payload: |
            {
              "source": "vscode-nlp",
              "tag": "${{ github.event.workflow_run.head_branch }}",
              "run_url": "${{ github.event.workflow_run.html_url }}"
            }
        # A deploy that cannot be pinged is not a reason to mark the release
        # red. nlp-studio's weekly scheduled run picks up anything missed here.
        continue-on-error: true
