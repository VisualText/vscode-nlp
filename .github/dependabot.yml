# Dependabot configuration.
#
# Security updates were already running without this file -- that is a repository
# setting, not a config one. What this adds is *version* updates: routine bumps
# for dependencies that have no advisory against them, which is how you avoid the
# situation where a security fix is three majors away because nothing moved for a
# year.
#
# Safe to have now that CI runs on every pull request. Before that, each of these
# would have been a manual verification.

version: 2

updates:
  # The extension itself.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # @types/vscode declares which VS Code API surface we compile against, and
      # vsce refuses to package when it exceeds engines.vscode -- "@types/vscode
      # ^1.125.0 greater than engines.vscode ^1.95.0". So this is not a routine
      # bump: raising it means raising the minimum VS Code version users need,
      # which is a decision about who gets dropped, not a dependency update.
      # Bump it by hand, together with engines.vscode.
      - dependency-name: "@types/vscode"

      # @types/node must describe the Node that VS Code actually runs on -- the
      # one inside its Electron build, currently Node 20 for VS Code 1.95. Types
      # ahead of that compile happily and then fail at runtime for users, which
      # nothing in CI would catch. Minor and patch bumps are fine; a major is a
      # deliberate choice to follow VS Code's own runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

      # TypeScript 7 is the Go rewrite (typescript-go), not a routine major. The
      # whole lint toolchain peers against the old compiler -- typescript-eslint
      # 8.68.0, the current latest, still declares typescript ">=4.8.4 <6.1.0" --
      # so npm ci fails ERESOLVE on every job the moment typescript goes to 7.
      # PR #1172 was closed for exactly this. Minor and patch bumps inside 6.x
      # keep flowing; revisit the major once typescript-eslint ships TS 7
      # support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR for the routine dev-tooling churn instead of six. Majors stay
      # separate, since those are the ones that actually need reading.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  # The Cloudflare worker, which has its own lockfile and its own toolchain.
  #
  # Note the overrides block in telemetry-worker/package.json pinning undici to
  # ^7.29.0: miniflare depends on exactly 7.28.0, which carries twelve
  # advisories. If Dependabot proposes a wrangler bump here, check `npm audit`
  # afterwards and remove the override only once miniflare has moved off 7.28.0.
  - package-ecosystem: npm
    directory: "/telemetry-worker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore

  # The actions used by ci.yml and release.yml. These go stale silently -- the v4
  # actions were being force-migrated to Node 24 by the runners before anyone
  # noticed the deprecation annotations.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
